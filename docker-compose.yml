name: ecommerce-base

x-backend: &backend
  image: ecommerce-base-api:phase04
  build:
    context: ./was
    dockerfile: Dockerfile
  environment: &app-environment
    APP_ENV: development
    HTTP_ADDR: :8080
    APP_VERSION: phase04
    GIN_MODE: release
    MOCK_PAYMENTS_ENABLED: ${MOCK_PAYMENTS_ENABLED:-true}
    AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Generate AUTH_JWT_SECRET in .env}
    REDIS_URL: redis://redis:6379/0
    RATE_LIMIT_PREFIX: ${RATE_LIMIT_PREFIX:-ecommerce:rate:}
    DATABASE_URL: postgres://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:?Copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-ecom}?sslmode=disable
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}
    REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-5s}
    SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    DB_TIMEOUT: ${DB_TIMEOUT:-3s}
  init: true
  stop_grace_period: 15s

services:
  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecom}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: [/app/migrate, up]
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'

  seed:
    <<: *backend
    command: [/app/seed]
    environment:
      <<: *app-environment
      SEED_STORE_NAME: ${SEED_STORE_NAME:-E-commerce Base}
      SEED_SHIPPING_FEE_VND: ${SEED_SHIPPING_FEE_VND:-30000}
      SEED_PHASE04_DATA: ${SEED_PHASE04_DATA:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_CUSTOMER_EMAIL: ${SEED_CUSTOMER_EMAIL:-customer@example.test}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: 'no'

  app:
    <<: *backend
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
    depends_on:
      seed: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/healthcheck]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: viewer/Dockerfile
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-8081}:80
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: [/app/worker]
    profiles: [infrastructure]
    depends_on:
      seed: {condition: service_completed_successfully}

  redis:
    image: redis:7.4-alpine
    ports: [127.0.0.1:56379:6379]
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    profiles: [infrastructure]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17.12-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: ecom_test
      POSTGRES_PASSWORD: isolated_test_only
      POSTGRES_DB: ecom_test
    ports: [127.0.0.1:55433:5432]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ecom_test -d ecom_test]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
