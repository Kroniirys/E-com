server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location /api/ { proxy_pass http://app:8080; proxy_set_header Host $host; proxy_set_header X-Request-ID $http_x_request_id; }
    location /health/ { proxy_pass http://app:8080; }
    location = /openapi.json { proxy_pass http://app:8080; }
    location /api-docs/ { try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ /index.html; }
}
